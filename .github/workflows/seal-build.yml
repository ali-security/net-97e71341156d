name: seal-build

# golang.org/x/net ships no GitHub Actions CI (upstream tests on Go's LUCI
# builders against the two supported Go releases). This workflow builds the
# module, runs its full `go test ./...` suite on Go 1.24 and 1.25, and packs
# the proxy.golang.org module zip with golang.org/x/mod/zip.CreateFromDir.
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Space-separated top-level Go test names to run instead of the full suite"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build-and-test:
    name: build and test (go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.24.x", "1.25.x"]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: false

      - name: Pack module zip
        if: matrix.go-version == '1.25.x'
        shell: bash
        run: |
          # Zip a copy of the tree without this workflow; the public module zip has no .github.
          mkdir -p "$RUNNER_TEMP/modsrc" "$RUNNER_TEMP/build_output" "$RUNNER_TEMP/zipper"
          cp -a . "$RUNNER_TEMP/modsrc/"
          rm -rf "$RUNNER_TEMP/modsrc/.github"
          cd "$RUNNER_TEMP/zipper"
          cat > create_mod.go <<'EOF'
          package main

          import (
              "log"
              "os"

              "golang.org/x/mod/module"
              "golang.org/x/mod/zip"
          )

          func main() {
              if len(os.Args) != 5 {
                  log.Fatal("usage: go run create_mod.go <module-path> <version> <source-dir> <output-zip>")
              }
              m := module.Version{Path: os.Args[1], Version: os.Args[2]}
              f, err := os.Create(os.Args[4])
              if err != nil {
                  log.Fatal(err)
              }
              defer f.Close()
              if err := zip.CreateFromDir(f, m, os.Args[3]); err != nil {
                  log.Fatal(err)
              }
              log.Printf("created module zip: %s", os.Args[4])
          }
          EOF
          go mod init example.com/zipper
          go get golang.org/x/mod@v0.28.0
          go run create_mod.go golang.org/x/net v0.45.0 "$RUNNER_TEMP/modsrc" "$RUNNER_TEMP/build_output/v0.45.0.zip"
          unzip -l "$RUNNER_TEMP/build_output/v0.45.0.zip" | tail -n 1

      - name: Upload module zip
        if: matrix.go-version == '1.25.x'
        uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: ${{ runner.temp }}/build_output/v0.45.0.zip
          if-no-files-found: error

      - name: Build
        shell: bash
        run: go build ./...

      - name: Test
        shell: bash
        run: |
          FILTER="${{ inputs.test-filter }}"
          if [ -n "$FILTER" ]; then
            go test -v -run "^($(echo "$FILTER" | tr ' ' '|'))$" ./... 2>&1 | tee "$RUNNER_TEMP/scoped.log"
            for t in $FILTER; do
              grep -qE "^=== RUN[[:space:]]+${t}(/|$)" "$RUNNER_TEMP/scoped.log" || { echo "selected test $t did not run"; exit 1; }
            done
          else
            go test -v ./... 2>&1 | tee "$RUNNER_TEMP/full.log"
            echo "TEST SUMMARY: $(grep -c '^--- PASS' "$RUNNER_TEMP/full.log") passed, $(grep -c '^--- FAIL' "$RUNNER_TEMP/full.log") failed, $(grep -c '^--- SKIP' "$RUNNER_TEMP/full.log") skipped"
          fi
